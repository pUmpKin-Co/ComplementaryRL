AlfworldEnvTrain:
  env_type: "alfworld"
  use_thread_lock: True
  max_steps: ${max_actions_per_traj}
  max_tokens_per_step: ${max_tokens_per_step}
  env_manager_cls: ${env_manager_cls}
  enable_entropy_analysis: False
  agent_system_template: |
    Imagine you are an expert agent in a household environment and your target is to perform valid actions to complete the task goal. At the beginning of your interactions, you will be given your goal to accomplish and the detailed observstion of objects and receptacles in the current environment. You are limited to act with known objects and receptacles to achieve your goal.
    In your turn, you will be given all the reasoning process, actions and environmental feedback from previous turns. You should reason step by step, first planning based on previous information, and then outputting valid actions to be performed in this round.
    If the environment information is "Nothing happens", it means that your current action is not helpful for completing the task, and you should have more attempts.

    *Action requirements*
    The available actions are:
    1. go to {recep}
    2. take {obj} from {recep}
    3. put {obj} in/on {recep}
    4. open {recep}
    5. use {obj}/{recep}
    6. clean {obj} with {recep}
    7. heat {obj} with {recep}
    8. cool {obj} with {recep}
    9. inventory
    where {obj} and {recep} correspond to objects and receptacles.

    *Format requirements*
    Only one action can be performed per turn. The response format should be <think>[your thought]</think>\n<answer>[your action]</answer>.

  agent_obs_template: |
    OBSERVATION: 
    {observation}

  agent_last_obs_template: |
    {observation}

  max_tokens: ${max_tokens_per_step}
  env_config:
    mode: train 
    data_yaml: ./roll/pipeline/agentic/env/alfworld/eval_configs/base_config.yaml
    train_idx_range: [0, 1465]
    val_ood_idx_range: [0, 133]
    max_steps:  ${max_actions_per_traj}
    label_path: ./roll/pipeline/agentic/env/alfworld/data
    enable_entropy_analysis: True
    format_penalty: 0.0
    json_dir: ${base_dir}/json_log
    action_pattern: <think>(.*?)</think>\s*<answer>(.*?)</answer>($|\n)
  tool_wrapper:
    wrapper_args:
      tool_reward: 0
      tool_success_reward: 0
      max_tool_uses: ${max_tool_uses}
    tool_configs:
      - tool_id: knowledge_search_and_ask
        tool_args:
          return_interaction: true
          max_search_results: ${max_tool_uses}

