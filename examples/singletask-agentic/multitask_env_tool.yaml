    enable_objects: true
    object_density: 0.15
    enable_traps: true
    trap_density: 0.05
    max_steps: ${max_actions_per_traj}
    observation_keys: ['glyphs', 'blstats', 'message', 'inv_strs', "chars_crop", "glyphs_crop"]
    render_mode: text
    use_skill_env: true
    lit: false
    premapped: false
